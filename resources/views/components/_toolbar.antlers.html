{{ nocache }}
    {{ if logged_in }}
        {{ toolbar_theme }}
        <div
            x-data="{ open: true }"
            x-cloak
            class="fixed bottom-2 right-2 z-50"
            style="--toolbar-bg: {{ global_header_bg }}; --toolbar-bg-hover: {{ gray_700 }}; --toolbar-primary: {{ primary }};"
        >
            <div class="flex flex-col-reverse items-end gap-1.5">
                {{# Toggle button — always visible #}}
                <button
                    x-on:click="open = !open"
                    class="flex h-9 w-9 items-center justify-center rounded-full text-white shadow-lg transition"
                    style="background: var(--toolbar-bg);"
                    x-on:mouseenter="$el.style.background = 'var(--toolbar-bg-hover)'"
                    x-on:mouseleave="$el.style.background = 'var(--toolbar-bg)'"
                    :aria-label="open ? 'Collapse toolbar' : 'Expand toolbar'"
                >
                    {{# Pencil icon (closed) #}}
                    <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    {{# X icon (open) #}}
                    <svg x-show="open" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                {{# Menu — slides up above toggle #}}
                <div x-show="open" x-collapse.duration.200ms class="flex flex-col gap-1.5">
                    {{ if edit_url }}
                        <a
                            href="{{ edit_url }}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-2 text-xs font-medium text-white shadow-lg transition"
                            style="background: var(--toolbar-bg);"
                            x-on:mouseenter="$el.style.background = 'var(--toolbar-bg-hover)'"
                            x-on:mouseleave="$el.style.background = 'var(--toolbar-bg)'"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            Edit
                        </a>
                    {{ /if }}

                    <a
                        href="{{ cp_url }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-2 text-xs font-medium text-white shadow-lg transition"
                        style="background: var(--toolbar-bg);"
                        x-on:mouseenter="$el.style.background = 'var(--toolbar-bg-hover)'"
                        x-on:mouseleave="$el.style.background = 'var(--toolbar-bg)'"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Control Panel
                    </a>
                </div>
            </div>
        </div>
        {{ /toolbar_theme }}
    {{ /if }}
{{ /nocache }}
