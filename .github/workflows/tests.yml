name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Statamic ${{ matrix.statamic }} / PHP 8.3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        statamic: ['^5.63', '^6.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: composer update --with "statamic/cms:${{ matrix.statamic }}" --prefer-dist --no-interaction --no-progress

      - name: Run PHP tests
        run: composer test

      - name: Run JavaScript tests
        run: node --test tests/toolbar.test.mjs
